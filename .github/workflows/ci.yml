name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests & debug builds (full + pure)
        run: ./gradlew testFullDebugUnitTest testPureDebugUnitTest assembleFullDebug assemblePureDebug

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk-full
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk-pure
          path: app/build/outputs/apk/pure/debug/app-pure-debug.apk
          retention-days: 7
