name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            echo "keystore decoded"
          else
            echo "KEYSTORE_BASE64 secret 未配置，回退 debug 签名（跨版本覆盖安装会失败）"
          fi

      - name: Build release APK (full + pure)
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleFullRelease assemblePureRelease

      - name: Print APK signature fingerprints
        run: |
          APKSIGNER=$(ls /usr/local/lib/android/sdk/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            echo "== 签名指纹（应与固定 keystore 一致：994e30928f051446745a047616edbbabb7d0620261b588ef4997cbed8d47e5db）=="
            for apk in app/build/outputs/apk/full/release/app-full-release.apk app/build/outputs/apk/pure/release/app-pure-release.apk; do
              echo "-- $apk"
              "$APKSIGNER" verify --print-certs "$apk" | head -3
            done
          else
            echo "runner 未找到 apksigner，跳过指纹输出"
          fi

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/full/release/app-full-release.apk shu-schedule-${{ github.ref_name }}.apk
          cp app/build/outputs/apk/pure/release/app-pure-release.apk shu-schedule-pure-${{ github.ref_name }}.apk

      - name: Locate release notes
        id: notes
        run: |
          if [ -f "changelogs/${{ github.ref_name }}.md" ]; then
            echo "path=changelogs/${{ github.ref_name }}.md" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "changelogs/${{ github.ref_name }}.md 不存在，回退自动生成 release notes"
          fi

      - name: Create release and upload APKs
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            shu-schedule-${{ github.ref_name }}.apk
            shu-schedule-pure-${{ github.ref_name }}.apk
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
